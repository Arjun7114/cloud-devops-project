# This is the CI/CD pipeline. GitHub runs it automatically on every push.
name: CI-CD Pipeline

# WHEN should this run? On every push to the "main" branch.
on:
  push:
    branches: [ main ]

# Values we reuse below. Edit these two if your account/region ever change.
env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: cloud-devops-app

jobs:
  build-and-push:
    # The robot runs on a fresh Ubuntu Linux machine in the cloud.
    runs-on: ubuntu-latest

    steps:
      # 1. Download your repo code onto the robot's machine.
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Python so we can run the tests.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install dependencies and run the tests.
      #    If a test fails, the whole pipeline stops here (that's the point).
      - name: Install dependencies and run tests
        run: |
          pip install -r requirements.txt
          pytest

      # 4. Log in to AWS using the secrets from the GitHub vault.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 5. Log Docker in to your ECR registry.
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 6. Build the image and push it to ECR.
      #    We tag it with the git commit ID (unique) AND "latest".
      - name: Build and push image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $REGISTRY/$ECR_REPOSITORY:latest .
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$ECR_REPOSITORY:latest
